name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      TZ: America/Anchorage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - run: npm ci
      - name: Verify outside UTC
        run: |
          date +'%Y-%m-%dT%H:%M:%S %Z %z'
          fort/scripts/verify.sh --no-emit
