# {{FORT_NAME}} fleet configuration.  Proofdelve ForgeOs-9mfw, Regent edict fortkit-fzpf,
# 2026-09-02, Overseer present.
#
# THIS FILE LIVES IN fort/scripts/ ON PURPOSE. That directory is kernel
# read-only to every masked seat in this fort, so no seat can switch the fleet
# on, raise its cap, or widen its concurrency from inside a session. Turning the
# fleet on is the Overseer's act, or a Regent's on his instruction. What the
# MAYOR owns is which beads are eligible, and she owns that through the
# `fleet-safe` label, which lives in bd where she can write it.
#
# IT SHIPS DISABLED, AND THE ORDER OF FIRST RUNS IS NOT NEGOTIABLE:
#   1. one deliberate daylight run, 3 or 4 fleet-safe beads, Overseer watching;
#   2. read the record — claims, verdicts, merges, closures, all of it;
#   3. only then one overnight run, with the hard stop set low.
# DO NOT LET THE FIRST UNATTENDED RUN BE THE FIRST TEST.

# The master switch. Nothing dispatches, merges or closes while this is 0.
# A FOUNDED FORT SHIPS THIS AT 0. The fleet has never run here. Turning it on is the
# Overseer's decision. Every fleet on a host shares its memory and its model quota,
# and each fleet's memory gate sees only its own workers, so the values below start
# small.
FLEET_ENABLED=0

# Forge concurrency STARTS here and is adaptive from there: rate-limit
# back-pressure steps it down, a sustained clean period steps it back up. There
# is deliberately no researched constant, because nobody has one for these plans
# and a guessed constant would be a false measurement.
#
# 2026-09-14: 1 -> 2, AND THE START IS NOW ONLY THE FIRST RUN'S (Proofdelve ForgeOs-xzg1,
# Regent edict, Overseer present). MEASURED by the Regent from ceiling.log at
# the sitting, corrected the same day on the Warden's review (the first
# text here carried the docket's figures unre-measured): 49 start lines, 48 at
# 1 and one at 3 (a manual run); 16 UP events, 14 of them 1->2 and TWO 2->3;
# 14 DOWN; and SEVEN runs reached the 18-launch cap (the event stream, which
# began before ceiling.log, counts 62 starts and the same 7 fleet.capped). The
# governor needs five clean completions per step and zeroes the streak on any
# back-pressure line, and the hard stop was ~9 beads -- so a run reached 2
# around its fifth bead, the two that reached 3 hit the cap within ten minutes
# of it, and 39 fleet beads measured a median 14 minutes claim-to-close,
# effectively serial. A run that ends ORDINARILY (drained, or budget spent) now
# writes its final ceiling to $FLEET_STATE/ceiling.last and the next run starts
# from it, clamped to [MIN, MAX]; every halt path removes that file, so the run
# after a halt starts from this value again. Each run's start line in
# ceiling.log says where its number came from.
# Concurrency 2 is SAFE BY CONSTRUCTION only with the touch-set co-dispatch
# guard (Proofdelve ForgeOs-b9mj, same sitting): two Forges cannot clobber each other in
# flight, they collide at the merge, and the guard is what keeps two beads that
# declare overlapping files from sharing a pass. An undeclared board stays
# serial whatever this number says.
FLEET_FORGE_START=1
FLEET_FORGE_MIN=1
FLEET_FORGE_MAX=1

# Review concurrency. FIXED AT 1 AND NOT ADAPTIVE. One Claude Max plan funds
# review, the Mayor and Emrith simultaneously, and review concurrency is the thing
# most likely to starve everything else.
FLEET_WARDEN_CONC=1

# Hard stop: total seat launches (Forge + Warden) in one run. The Overseer set
# 20 on 2026-09-02; the sitting brief had proposed 40 and he halved it for the
# first nights. Raising it is his act, after the sustained-ceiling log has a
# night in it (see $FLEET_STATE/ceiling.log).
#
# WHAT THIS NUMBER MEANS CHANGED ON 2026-09-04 (Proofdelve ForgeOs-feeq, Regent edict).
# READ THIS BEFORE COMPARING IT TO AN OLDER RUN:
#   - It now permits exactly N launches. It used to permit N-1: the counter was
#     incremented and then tested, so the Nth launch was refused and never made.
#     20 meant 19.
#   - Reaching it is ORDINARY EXHAUSTION and ends the run cleanly. It used to
#     call halt(), which writes $FLEET_STATE/HALT, and every later run refuses
#     while that file exists — so a SUCCESSFUL busy night disabled the fleet
#     until somebody deleted a file by hand.
#   - It is checked BEFORE a bead is claimed or a review launched, not after, so
#     the bead that meets the cap is no longer left claimed with no worker.
#
# 2026-09-08: raised 8 -> 12, MEASURED rather than estimated. The 16:11 run
# used exactly 8 of 8: three beads at two launches each, plus one
# REQUEST-CHANGES return that cost two more. It printed "drained" rather than
# "budget spent" only because the eighth launch happened to be the last one
# needed. One more return anywhere would have stopped it with work undone.
# 12 gives room for three returns against a three-bead queue.
#
# The arithmetic, so the next person does not rediscover it: a full cycle is
# exactly two launches, one to build and one to review. A return costs two
# more. The post-merge verifier is free.
#
# 2026-09-14: 18 -> 36, the Overseer's act after the ceiling log had its data
# (Proofdelve ForgeOs-xzg1; 49 runs recorded). 18 was ~9 beads at two launches each:
# SEVEN runs between 09-12 and 09-14 ended at the cap (fleet.capped), and with
# the ceiling now carried across runs a run that reaches concurrency 2 by its
# fifth bead would have spent the rest of its budget in the few beads that
# followed. 36 is ~18
# beads, or ~12 with returns, against an overnight that landed 26 in 6h05
# serially. Review concurrency (FLEET_WARDEN_CONC=1) remains the true ceiling:
# ~8 beads/hour whatever these two numbers say.
FLEET_HARD_STOP=6

# Returns before a bead stops being retried and goes to the Mayor instead.
FLEET_MAX_RETURNS=2

# Seconds between passes when there is nothing to reap and nothing to dispatch.
FLEET_POLL=30

# Verify-or-review completions one reap pass takes before it ends, so the next
# pass lands signed beads first (Proofdelve ForgeOs-bzr1z; the Overseer chose 2 on
# 2026-10-27). Merges (deferred, signed) do not count. Default 2 when unset.
FLEET_REAP_PER_PASS=2

# Consecutive passes that dispatched nothing, reaped nothing, had no Forge live
# and STILL found startable work, before the run halts ITSELF as stalled
# (Proofdelve ForgeOs-dx34.9; the mechanism is stall_check() in fleet.sh). THIS IS NOT A
# TIME THRESHOLD AND MUST NOT BECOME ONE: the 27-run measurement on
# Proofdelve ForgeOs-dx34.4 refuted every clock (16.1 minutes of silence in the wedged run
# against 14.2 in a clean drain). It counts passes that changed no state, which
# a real wedge reproduces on every pass, so any value halts a wedge; the value
# only decides how many odd single passes are forgiven -- a bead labelled
# fleet-safe mid-pass, one claim refused under tracker contention. 3 is 90
# seconds at FLEET_POLL=30, against a wedge that ran sixteen minutes and ended
# by a person's hand. A stall halts with the halt file and an incident, like a
# red main: it is a defect somewhere, and the next run must not restart into it.
FLEET_STALL_PASSES=3

# Models. Same ladders the launchers default to; named here so a run records
# what it asked for rather than inheriting a global default silently.
#
# 2026-11-13: gpt-5.6-terra -> gpt-6.1-terra (docket 2026-11-13 item C, Regent
# sitting, Overseer present). His rule: "GPT-6.1 Sol if listed and priced near
# Terra, else GPT-6.1 Terra". Codex CLI 0.169.0's catalog (codex debug models)
# lists both, calling Sol the latest workhorse; third-party price lists put Sol
# at twice Terra's token rates, and the catalog marks Sol's fast tier as
# "increased usage" and Terra's not, so Terra. THE TRIAL, before the fleet
# resumed: Proofdelve ForgeOs-yi1pq, two Regent-launched laps on gpt-6.1-terra (records on
# Proofdelve ForgeOs-gfuc1 and Proofdelve ForgeOs-yi1pq). Lap 1 implemented and committed in ~4.5 min
# and its host verify went RED at contract-drift (C# DTO fields with no TS
# twin), a gap in the new item-A brief rather than the model, folded the same
# hour; lap 2 fixed it and the full host verify passed (exit 0, dotnet
# 1880/0/0, Docker up) at fc965dd5b. TO REVERT: gpt-5.6-terra.
FLEET_FORGE_MODEL=gpt-6.1-terra

# THE STRONG FORGE MODEL (docket 2026-11-13 item B, Regent sitting, Overseer
# present; his choice at the sitting: gpt-6-astra, cost accepted). A bead
# labelled forge-strong (the Mayor labels web layout beads at filing,
# fort/seats/mayor.md) dispatches on this model; every other bead on
# FLEET_FORGE_MODEL. TO REVERT: delete this line, or set it empty, and every
# bead dispatches on FLEET_FORGE_MODEL again. Measure after a week: first-pass
# approval of forge-strong beads against the 11-12..13 baseline.
FLEET_FORGE_MODEL_STRONG=gpt-6-astra

# HOW OLD A HOST-VERIFY GREEN MAY BE AND STILL BE REUSED AFTER A REFRESH
# (fleet.sh refresh_reusable(), Proofdelve ForgeOs-gfuc1 A2). The Overseer at the sitting,
# on the Warden's finding that a signed landing whose branch and main have not
# moved now runs no verify at all: "keep zero-run reuse, but only when the
# reused green is recent". Older than this many hours: the host verify runs as
# before. TO REVERT the whole A2 reuse: FLEET_VERIFY_REUSE=off (it also turns
# off the post-merge reuse), or set this to 0.
FLEET_REFRESH_REUSE_MAX_AGE_H=12

# THE REVIEW LADDER, tried in order (Proofdelve ForgeOs-57xc, Regent edict 2026-09-04).
# This replaces FLEET_WARDEN_MODEL, which named one model and had no ladder
# behind it. A rung that records no verdict is an AVAILABILITY failure and the
# next rung is tried; when the list is exhausted the bead is paged to the
# Overseer (fleet-safe removed, `human` applied) and is NEVER returned to the
# Forge. Re-running implementation over work that was already verifier-green
# charges a review failure to the Forge, which is what used to happen, at a
# measured 17.2% no-verdict rate.
#
# ONE RUNG TODAY, AND THAT IS A CONSTRAINT RATHER THAN A CHOICE. The charter's
# Warden ladder is "Opus 5 -> GPT-5.6 Sol -> block and page Justin", but
# fortkit-78o records that `gpt-5.6-sol` is not a model the review CLI can
# select, so encoding it would spend a launch slot on a session that dies at
# launch and arrive at the same page. Overseer's decision, 2026-09-04, with the
# alternatives on the record: page on the first no-verdict. WHEN fortkit-78o
# LANDS, THE WHOLE FIX IS TO ADD THE RUNG TO THIS LINE.
#
# Never add a rung below frontier. The charter is explicit: the Warden never
# degrades, and "never retry a failing bead on a cheaper model".
FLEET_WARDEN_LADDER="opus"

# Seconds a worker directory is treated as a live Forge before its pid file
# appears (Proofdelve ForgeOs-l1ef). mkdir happens in the dispatcher and the pid is written
# by the child, so there is a real window with neither a pid nor an exit code.
# Inside it a worker counts as LIVE, which errs toward dispatching fewer Forges
# rather than double-booking a concurrency slot. Outside it, a worker with no
# live pid and no exit code is a Forge that died hard: it stops consuming a slot
# forever and says so on stdout.
FLEET_LAUNCH_GRACE=120

# The memory gate on Forge dispatch (Proofdelve ForgeOs-asad6 step 2, 2026-10-15 Regent
# sitting; the reasoning is above mem_gate_why() in fleet.sh). A launch waits
# while MemAvailable minus PER_BUILD x (young live Forges + this launch + the
# host verifier) is below FLOOR. A Forge is young for BUILD_WINDOW_S after it
# starts; after that its memory is already inside MemAvailable. Concurrency
# steps down (at most once per STEPDOWN_EVERY_S) below STEPDOWN_MB available,
# or on swap full together with available below the floor.
# The numbers are the Mayor's estimates from the 2026-10-15 06:14 near-miss.
# Every refusal writes avail/young/need to ceiling.log: tune from that. What
# they mean on this host as measured at the sitting (14 GiB available, nothing
# building): one launch clears (needs 13 GiB) and a second waits (15.5 GiB)
# until the first is past its build window.
FLEET_MEM_FLOOR_MB=6144
FLEET_MEM_PER_BUILD_MB=2048
FLEET_MEM_BUILD_WINDOW_S=900
FLEET_MEM_STEPDOWN_MB=6144
FLEET_MEM_STEPDOWN_EVERY_S=300
